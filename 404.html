<!doctype html>
<html lang="fr" data-theme="soir">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Page introuvable · Paragraphe</title>
    <meta name="description" content="Ton carnet de lecture privé : note, commente, retrouve chaque livre lu.">
    <meta name="theme-color" content="#1C283D">
    <meta name="robots" content="noindex">
    <script>
      // Thème choisi (Soir par défaut), appliqué avant l'affichage pour éviter un flash.
      try { document.documentElement.dataset.theme = localStorage.getItem('paragraphe-theme') === 'jour' ? 'jour' : 'soir'; } catch (e) {}
      // Retour d'un lien reçu par e-mail : on note son type avant que Supabase ne nettoie l'adresse.
      window.lienEmail = { recuperation: /type=recovery/.test(location.hash), erreur: /error_code=/.test(location.hash + location.search) };
    </script>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
  </head>
  <body>
    <a class="evitement" href="#contenu">Aller au contenu</a>
    <header class="entete" id="entete"><div class="conteneur barre"></div></header>
    <main id="contenu">
      <div class="conteneur page introuvable">
        <svg class="symb" viewBox="0 0 10 10" aria-hidden="true"></svg>
        <h1 class="titre-1">Cette page n’existe pas.</h1>
        <p class="petit">Le livre a peut-être été retiré de ta bibliothèque, ou l’adresse est incomplète.</p>
        <a class="btn btn-principal" href="index.html">Retour à ma bibliothèque</a>
      </div>
    </main>
    <footer class="pied" id="pied"></footer>
    <script type="module" src="simple.js?v=6"></script>
    <script>
      // Filet de sécurité : si le site ne démarre pas (fichier manquant ou ancienne version en cache), on l'explique.
      setTimeout(function () {
        var c = document.querySelector('.chargement');
        if (c && document.body.contains(c)) c.innerHTML = 'Le site n’a pas pu se charger. Recharge la page en forçant la mise à jour : <strong>Cmd + Maj + R</strong> sur Mac, <strong>Ctrl + Maj + R</strong> sur Windows. Si le problème continue, vérifie que tous les fichiers du site sont bien sur GitHub.';
      }, 10000);
    </script>
  </body>
</html>
